<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Image Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 480px;
      background: #0f0f0f;
      color: #e0e0e0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 { font-size: 14px; font-weight: 600; color: #fff; }
    #count { font-size: 12px; color: #888; }

    #controls {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #141414;
      border-bottom: 1px solid #222;
      align-items: center;
    }

    #search {
      flex: 1;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 10px;
      color: #e0e0e0;
      font-size: 12px;
      outline: none;
    }
    #search:focus { border-color: #555; }
    #search::placeholder { color: #555; }

    .btn {
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: #2a2a2a; color: #fff; }
    .btn-primary { background: #2563eb; border-color: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-toggle { background: #222; border: 1px solid #333; color: #888; }
    .btn-toggle.active { background: #1a3a1a; border-color: #22c55e; color: #22c55e; }

    #grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 10px;
      max-height: 520px;
      overflow-y: auto;
    }

    #grid::-webkit-scrollbar { width: 6px; }
    #grid::-webkit-scrollbar-track { background: #111; }
    #grid::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .img-card {
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
    }

    .img-thumb {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: #111;
    }

    .img-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hq-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: #2563eb;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }

    .img-size {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0,0,0,0.65);
      color: #ccc;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 3px;
    }

    .img-actions {
      display: flex;
      gap: 6px;
      padding: 8px;
    }

    .dl-btn {
      flex: 1;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: background 0.15s;
    }
    .dl-btn:hover { background: #1d4ed8; }
    .dl-btn.downloaded { background: #16a34a; }
    .dl-btn.error { background: #dc2626; }

    .open-btn {
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: #aaa;
      font-size: 11px;
      padding: 8px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .open-btn:hover { background: #2a2a2a; color: #fff; }

    #empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #555;
      gap: 10px;
      text-align: center;
    }
    #empty p { font-size: 13px; }

    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #555;
      gap: 10px;
      font-size: 13px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #333;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header>
    <h1>HQ Image Downloader</h1>
    <span id="count">Loading...</span>
  </header>
  <div id="controls">
    <input id="search" type="text" placeholder="Filter images..." />
    <button class="btn btn-toggle" id="hq-only-btn">HQ only</button>
    <button class="btn btn-primary" id="refresh-btn">Refresh</button>
    <button class="btn" id="download-all-btn">Download all</button>
  </div>
  <div id="loading">
    <div class="spinner"></div>
    Scanning page...
  </div>
  <div id="grid"></div>
  <div id="empty">
    <p>No images found on this page</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
