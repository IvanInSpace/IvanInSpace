<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HQ Image Downloader</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 480px;
      background: #0f0f0f;
      color: #e0e0e0;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.3px;
    }

    #count {
      font-size: 12px;
      color: #888;
    }

    #controls {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      background: #141414;
      border-bottom: 1px solid #222;
      align-items: center;
    }

    #search {
      flex: 1;
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 10px;
      color: #e0e0e0;
      font-size: 12px;
      outline: none;
    }

    #search:focus {
      border-color: #555;
    }

    #search::placeholder {
      color: #555;
    }

    .btn {
      background: #222;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      font-size: 11px;
      padding: 6px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #2a2a2a;
      color: #fff;
    }

    .btn-primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      padding: 2px;
      max-height: 460px;
      overflow-y: auto;
    }

    #grid::-webkit-scrollbar {
      width: 6px;
    }

    #grid::-webkit-scrollbar-track {
      background: #111;
    }

    #grid::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    .img-card {
      position: relative;
      aspect-ratio: 1;
      background: #1a1a1a;
      overflow: hidden;
      cursor: pointer;
    }

    .img-card:hover .overlay {
      opacity: 1;
    }

    .img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .overlay .dl-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }

    .overlay .dl-btn:hover {
      background: #1d4ed8;
    }

    .overlay .dl-btn.downloaded {
      background: #16a34a;
    }

    .overlay .open-btn {
      background: transparent;
      color: #aaa;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .overlay .open-btn:hover {
      color: #fff;
      border-color: #888;
    }

    .img-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 3px 5px;
      background: rgba(0,0,0,0.6);
      font-size: 10px;
      color: #bbb;
      pointer-events: none;
    }

    #empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      color: #555;
      gap: 10px;
      text-align: center;
    }

    #empty svg {
      opacity: 0.3;
    }

    #empty p {
      font-size: 13px;
    }

    #loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #555;
      gap: 10px;
      font-size: 13px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #333;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hq-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #2563eb;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 3px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>HQ Image Downloader</h1>
    <span id="count">Loading...</span>
  </header>
  <div id="controls">
    <input id="search" type="text" placeholder="Filter images..." />
    <button class="btn btn-primary" id="refresh-btn">Refresh</button>
    <button class="btn" id="download-all-btn">Download all</button>
  </div>
  <div id="loading">
    <div class="spinner"></div>
    Scanning page...
  </div>
  <div id="grid"></div>
  <div id="empty">
    <svg width="40" height="40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
    </svg>
    <p>No images found on this page</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
